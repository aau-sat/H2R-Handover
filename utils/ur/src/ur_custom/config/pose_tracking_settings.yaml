#################################
# PID parameters for pose seeking
#################################

# Maximum value of error integral for all PID controllers
windup_limit: 0.05

# PID gains
x_proportional_gain: 6.5 # 4.5 everywhere
y_proportional_gain: 6.5
z_proportional_gain: 6.5
x_integral_gain: 0.1 #0.05
y_integral_gain: 0.1 #0.05
z_integral_gain: 0.1 #0.05
x_derivative_gain: 0.5 #1.5
y_derivative_gain: 0.5 #1.5
z_derivative_gain: 0.5 #1.5

angular_proportional_gain: 5.5 #6.0
angular_integral_gain: 0.01 #0.0
angular_derivative_gain: 0.2 #0.5
