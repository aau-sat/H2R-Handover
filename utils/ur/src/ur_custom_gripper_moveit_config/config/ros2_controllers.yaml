controller_manager:
  ros__parameters:
    update_rate: 100 # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    io_and_status_controller:
      type: ur_controllers/GPIOController

    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster

    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster

    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    scaled_joint_trajectory_controller:
      type: ur_controllers/ScaledJointTrajectoryController

    forward_velocity_controller:
      type: velocity_controllers/JointGroupVelocityController

    forward_position_controller:
      type: position_controllers/JointGroupPositionController

    forward_effort_controller:
      type: effort_controllers/JointGroupEffortController
    
    force_mode_controller:
      type: ur_controllers/ForceModeController
    
    freedrive_mode_controller:
      type: ur_controllers/FreedriveModeController
    
    passthrough_trajectory_controller:
      type: ur_controllers/PassthroughTrajectoryController

    tcp_pose_broadcaster:
      type: pose_broadcaster/PoseBroadcaster

    ur_configuration_controller:
      type: ur_controllers/URConfigurationController
    
    tool_contact_controller:
      type: ur_controllers/ToolContactController
    
    gripper_position_controller:
      type: position_controllers/GripperActionController

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    # tf_prefix: "$(var tf_prefix)"

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: $(var tf_prefix)tcp_fts_sensor
    state_interface_names:
      - force.x
      - force.y
      - force.z
      - torque.x
      - torque.y
      - torque.z
    frame_id: $(var tf_prefix)tool0
    topic_name: ft_data


joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.3, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.3, goal: 0.1 }
      elbow_joint: { trajectory: 0.3, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.3, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.3, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.3, goal: 0.1 }


scaled_joint_trajectory_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.0
      shoulder_pan_joint: { trajectory: 0.3, goal: 0.1 }
      shoulder_lift_joint: { trajectory: 0.3, goal: 0.1 }
      elbow_joint: { trajectory: 0.3, goal: 0.1 }
      wrist_1_joint: { trajectory: 0.3, goal: 0.1 }
      wrist_2_joint: { trajectory: 0.3, goal: 0.1 }
      wrist_3_joint: { trajectory: 0.3, goal: 0.1 }
    speed_scaling_interface_name: speed_scaling/speed_scaling_factor

passthrough_trajectory_controller:
  ros__parameters:
    # tf_prefix: "$(var tf_prefix)"
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    state_interfaces:
      - position
      - velocity
    speed_scaling_interface_name: speed_scaling/speed_scaling_factor

forward_velocity_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: velocity

forward_position_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

forward_effort_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint
    interface_name: effort

gripper_position_controller:
  ros__parameters:
    default: true
    action_monitor_rate: 20.0
    allow_stalling: true
    joint: 'finger_joint'
    use_effort_interface: true
    use_speed_interface: false
    
    # Safety limits
    goal_tolerance: 0.01
    stall_velocity_threshold: 0.001
    stall_timeout: 3.0 #1.0
    max_effort: 1.0

